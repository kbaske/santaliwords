name: Santali Bot
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Dependencies
        run: pip install requests
      - name: Run Bot
        run: python scraper.py
      - name: Commit Changes
        run: |
          git config --global user.name "SantaliBot"
          git config --global user.email "professor@santals.in"
          git add santali_wordlist.txt stats.json
          git commit -m "Bot: Update wordlist" || echo "No changes to commit"
          git push
