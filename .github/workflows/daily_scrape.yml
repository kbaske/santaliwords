name: Santali Wordlist Bot
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Scrape and Clean
        run: |
          python scraper.py
          python cleaner.py
      - name: Push to Repo
        run: |
          git config --global user.name "SantaliBot"
          git config --global user.email "professor@santali.in"
          git add .
          git commit -m "Bot: Update wordlist" || echo "No changes"
          git push
